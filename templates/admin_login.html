<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin sign in</title>
    <script nonce="{{ nonce }}">
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <style nonce="{{ nonce }}">
      :root {
        --bg: #f5f1ea; --panel: #fffdfb; --border: rgba(25, 28, 35, 0.12); --text: #1d2430; --muted: #5f6776;
        --accent: #4a6fa5; --accent-strong: #2a466f; --danger: #b54d4d; --danger-soft: #ffe8e3;
        --shadow: 0 20px 45px rgba(24, 30, 40, 0.08);
      }
      :root[data-theme="dark"] {
        --bg: #101722; --panel: #172231; --border: rgba(255, 255, 255, 0.1); --text: #eef3fb; --muted: #b3bfd4;
        --accent: #98bcff; --accent-strong: #dfeafc; --danger: #f09a9a; --danger-soft: rgba(240, 154, 154, 0.14);
        --shadow: 0 18px 42px rgba(0, 0, 0, 0.35); color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
      .card { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--border);
        border-radius: 22px; padding: 28px 24px; box-shadow: var(--shadow); }
      h1 { margin: 0 0 4px; font-size: 1.3rem; letter-spacing: -0.02em; }
      p { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
      label { display: block; margin-bottom: 6px; font-size: 0.82rem; font-weight: 600; color: var(--muted); }
      input[type="password"] { width: 100%; min-height: 46px; padding: 0 14px; border-radius: 12px; font-size: 16px;
        border: 1px solid var(--border); background: transparent; color: var(--text); }
      input[type="password"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      button { width: 100%; min-height: 48px; margin-top: 16px; border: 0; border-radius: 14px; cursor: pointer;
        font-size: 0.96rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); }
      :root[data-theme="dark"] button { color: #0e1726; background: linear-gradient(135deg, #98bcff, #6f97de); }
      .error { margin-bottom: 14px; padding: 10px 12px; border-radius: 12px; font-size: 0.88rem;
        background: var(--danger-soft); color: var(--danger); }
    </style>
  </head>
  <body>
    <form class="card" method="post" action="/admin/login">
      <h1>Admin</h1>
      <p>Lyrics by Favour &middot; usage dashboard</p>
      {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus required />
      <button type="submit">Sign in</button>
    </form>
  </body>
</html>
